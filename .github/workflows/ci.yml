#  Maya on both platforms.
#
#  Maya is developed on Windows. "Nothing has been run on Linux" was the open
#  item in `docs/PLAN.md` that mattered most, and this workflow is what closed
#  it — both legs now pass. Keeping it green is the whole point: of the five
#  faults the first three runs found, two were real bugs and three were checks
#  that were wrong about the machine they ran on. None had been reached by
#  reasoning about the code first.
#
#  The verification harnesses in tools/verify/ that drive a real pseudoconsole
#  need the optional node-pty, which has no Linux prebuild. They print SKIPPED
#  and exit 0 there (see tools/verify/need-pty.mjs), so the three that need no
#  terminal still run on both platforms.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even when one fails: "it broke on Linux" is only
      # useful next to whether it also broke on Windows.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # No `version:` here. The action reads `packageManager` from
      # package.json, and giving it both is a hard error — "Multiple versions
      # of pnpm specified" — which killed both legs of the first run before
      # anything was installed. One source of truth, and it is the one pnpm
      # already enforces locally.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 ^13 has prebuilds for Node 25 (ABI 141); an older
          # major tries to compile and wants a C++ toolchain.
          node-version: 25
          cache: pnpm

      # A runner has no git identity, and Maya commits on the user's behalf
      # on every task — `maya init` alone makes an empty first commit. The
      # first real CI run died on exactly this.
      - name: Give git an identity
        run: |
          git config --global user.name "maya ci"
          git config --global user.email "ci@maya.invalid"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The harnesses that need no pseudoconsole. These exercise a real
      # daemon over a real socket, the MCP server over stdio, and the packaged
      # bundle driven from an unrelated directory — the seams unit tests paper
      # over, and the places a platform difference would actually show.
      - name: Verify the MCP server
        run: node tools/verify/mcp.mjs

      - name: Verify the agent probes
        run: node tools/verify/agents.mjs

      - name: Verify the packaged bundle
        run: pnpm package && node tools/verify/packaged.mjs

      # Reports SKIPPED and exits 0 where node-pty is unavailable, so this step
      # is a free pass on Linux and a real check on Windows.
      - name: Verify the panes
        run: node tools/verify/panes.mjs

      - name: Verify the column widths
        run: node tools/verify/column-width.mjs

  # A Linux box with nothing on it: Node and git, no compiler, no pnpm. That
  # is what the README asks for, and the job above cannot stand in for it —
  # GitHub's runners carry build tools, so node-pty compiles there and its
  # absence never gets tested. The first time this was tried by hand, in a
  # container, `pnpm build` failed outright: node-pty was called an optional
  # dependency but `typeof import("node-pty")` made it a compile-time one, so
  # the build and therefore install.sh could not run on such a machine at all.
  # This job is here so that cannot come back unnoticed.
  installer:
    name: linux with no compiler
    runs-on: ubuntu-latest
    container: node:25-bookworm-slim

    steps:
      # Before checkout, which otherwise falls back to a tarball download and
      # leaves no repository for install.sh to build from.
      - name: Add git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Give git an identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "maya ci"
          git config --global user.email "ci@maya.invalid"

      # Node 25 ships no corepack, so this is the step a person has to take
      # too. Root inside the container, so no prefix is needed here.
      - name: Install pnpm
        run: npm install -g pnpm

      # The whole installer, as the README tells someone to run it: no chmod
      # first, because the file is committed executable.
      - name: Run install.sh
        run: ./install.sh --no-path

      - name: The installed command runs
        run: ~/.local/bin/maya --version

      - name: And can prepare a project
        run: |
          ~/.local/bin/maya init /tmp/ci-project
          # doctor exits non-zero when an enabled worker's CLI is missing, and
          # this container deliberately has none of them — so a clean bill of
          # health here would mean doctor was not looking. What is checked is
          # that it runs and reports, which is why the checks are grepped
          # rather than the exit code trusted.
          ~/.local/bin/maya doctor -d /tmp/ci-project > /tmp/doctor.log 2>&1 || true
          cat /tmp/doctor.log
          grep -q "git knows who you are" /tmp/doctor.log
          grep -q "event store is in WAL mode" /tmp/doctor.log
          grep -q "Claude Code" /tmp/doctor.log
